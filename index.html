<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Without — Legal</title>
    <style>
      :root { --bg:#F6F1E7; --surface:#FFFCF6; --border:#E3D9C9; --text:#1C1813; --muted:#6B6156; --brand:#B44724; }
      * { box-sizing: border-box; }
      body { margin:0; background:var(--bg); color:var(--text); font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
      main { max-width:720px; margin:0 auto; padding:40px 20px 80px; }
      h1 { font-size:32px; margin:0 0 8px; }
      h2 { font-size:20px; margin:28px 0 8px; }
      p, li { color:var(--muted); }
      a { color:var(--brand); }
      .card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:20px; margin-top:16px; }
      .links a { display:block; padding:12px 0; border-bottom:1px solid var(--border); }
      .links a:last-child { border-bottom:0; }
    </style>
  </head>
  <body>
    <main>
      <h1>Without</h1>
      <p>A quiet place to quit. Legal and support pages below.</p>
      <div class="card links">
        <a href="./privacy.html">Privacy Policy</a>
        <a href="./terms.html">Terms of Use</a>
        <a href="./delete-account.html">Delete your account</a>
        <a href="mailto:chefmeupai@gmail.com">Support: chefmeupai@gmail.com</a>
      </div>
    </main>
  </body>
</html>
